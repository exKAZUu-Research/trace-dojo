WB_ENV = { default = "staging" }
NEXT_PUBLIC_WB_ENV = { default = "staging" }
DATABASE_URL = { default = "file:./mount/prod.sqlite3?connection_limit=1" }
PORT = { default = "8080" }
NEXT_PUBLIC_BASE_URL = { default = "https://trace-dojo-staging.fly.dev" }
