[profiles.development.secrets]
WB_ENV = { default = "development" }
NEXT_PUBLIC_WB_ENV = { default = "development" }
DATABASE_URL = { default = "file:./prisma/dev.sqlite3" }
# Pinned because `next build` needs a base URL (SuperTokens rejects an empty domain).
PORT = { default = "3500" }
NEXT_PUBLIC_BASE_URL = { default = "http://localhost:3500" }
# Shared development instance, kept plaintext because it holds nothing worth protecting.
SUPERTOKENS_URI = { default = "https://st-dev-9ecbdd10-5f8e-11ef-a204-f3d2d26d900f.aws.supertokens.io" }
SUPERTOKENS_API_KEY = { default = "Si4e5YY3MM2UH=pQ7Hf5KqKapY" }
# The judge service (https://github.com/WillBooster/judge) executes the Java programs of fill-in-the-blank
# answers. Its key grants arbitrary code execution, so it is encrypted even in this profile, which therefore
# resolves only with an age identity (locally) or FNOX_AGE_KEY (in CI). The production instance serves this
# profile too because the staging one sleeps between deployments and drops connections when it wakes.
JUDGE_URL = { default = "https://judge.willbooster.com" }
JUDGE_API_KEY = { provider = "age", value = "" }

[profiles.test.secrets]
WB_ENV = { default = "test" }
NEXT_PUBLIC_WB_ENV = { default = "test" }
