name: autofix.ci

on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read

concurrency:
  group: autofix-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      # WB_ENV selects the fnox profile.
      WB_ENV: test
    steps:
      - uses: actions/checkout@v7.0.1
      # Installs the tools pinned in mise.toml, including fnox so the test profile values load.
      - uses: jdx/mise-action@v5.2.3
        with:
          cache: true
      - run: bun install
      - run: bun run cleanup
      - run: bun run build
      - uses: autofix-ci/action@v1.3.4
